# No tunnel ID or hostname here, so the file is the same for every copy of this repo.
# TUNNEL_TOKEN in .env says which tunnel this is, and only hostnames routed to that tunnel
# in DNS ever arrive, so the rules match on path alone.
ingress:
  # Only n8n's production webhooks and its health check are public; the editor never is.
  - path: ^/webhook/
    service: http://n8n:5678
  - path: ^/healthz$
    service: http://n8n:5678
  - service: http_status:404
