<text x="92" y="560" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">Pasted into n8n's editor, not .env:</text>
<text x="92" y="584" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">Slack bot token, Shopify webhook signing secret, Shopify client credentials. Stored in the n8n_data volume,</text>
<text x="92" y="603" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">encrypted with N8N_ENCRYPTION_KEY. The repo holds only secret-free stubs (D28).</text>
