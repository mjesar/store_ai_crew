<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Where the secrets live</title><desc id="d">.env on the server holds nine values. Docker Compose hands each container only the names listed for it: n8n gets four, cloudflared gets the tunnel token. The Shopify values are read by a script on the host. The Slack token and the Shopify secret n8n uses are pasted into n8n credentials, stored encrypted in its volume.</desc>
<defs><marker id="a-web" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker><marker id="a-admin" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker><marker id="a-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker></defs>
<rect width="1240" height="640" rx="16" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#1f2328" font-weight="700" text-anchor="start">Where the secrets live</text>
<text x="40" y="80" font-size="14.5" fill="#59636e" font-weight="400" text-anchor="start">Each container gets only the values it uses (D19, D31). Nothing here is ever committed to git.</text>
<rect x="40" y="112" width="360" height="380" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
