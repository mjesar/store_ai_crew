<text x="848" y="143" font-size="16" fill="#1f2328" font-weight="650" text-anchor="start">n8n container</text>
<text x="816" y="166" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">sees 4 values: the N8N_* group</text>
<text x="816" y="185" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">no Shopify secret, no tunnel token</text>
<text x="816" y="204" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">$env in nodes blocked too (n8n default)</text>
