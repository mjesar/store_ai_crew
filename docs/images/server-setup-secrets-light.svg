<text x="524" y="236" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">docker-compose.yml</text>
<text x="486" y="266" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">fills each ${NAME} from .env,</text>
<text x="486" y="286" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">but passes a container only</text>
<text x="486" y="306" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">the names it lists:</text>
<text x="486" y="340" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">environment:</text>
<text x="502" y="360" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">N8N_WEBHOOK_URL: ${…}</text>
<text x="502" y="380" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">…</text>
