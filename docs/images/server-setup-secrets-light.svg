<text x="92" y="146" font-size="17" fill="#1f2328" font-weight="700" text-anchor="start">.env on the server</text>
<text x="56" y="170" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">copied from the laptop, chmod 600</text>
<circle cx="380" cy="138" r="11" fill="#1f2328"/>
<text x="380" y="142.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="56" y="192" width="5" height="102" rx="2.5" fill="#1a7f37"/>
