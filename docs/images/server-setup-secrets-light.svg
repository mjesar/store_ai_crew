<text x="816" y="442" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">reads SHOPIFY_* and the webhook URL itself,</text>
<text x="816" y="461" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">not via Docker, to subscribe the store once</text>
