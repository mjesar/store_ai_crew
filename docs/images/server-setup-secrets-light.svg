<text x="74" y="236" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">N8N_WEBHOOK_URL</text>
<text x="74" y="258" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">N8N_PROXY_HOPS</text>
<text x="74" y="280" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">N8N_EDITOR_BASE_URL</text>
